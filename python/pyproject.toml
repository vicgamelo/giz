[project]
name = "lousa-engine"
version = "0.1.0"
description = "Motor da Lousa: perfil, receita, AutoML e exportação. Roda no Pyodide e no CPython."
requires-python = "==3.14.*"
# Mesmas versões do Pyodide 314.0.7 (pyodide-lock.json), para o teste local valer para o navegador.
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.2",
  "scipy==1.18.0",
  "scikit-learn==1.8.0",
  "lightgbm==4.6.0",
  "xgboost==2.1.4",
  "python-calamine==0.6.2",
  "skops==0.16.0",
]

[dependency-groups]
dev = ["pytest>=8", "openpyxl>=3.1", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py314"
